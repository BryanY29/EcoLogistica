services:
  db:
    image: postgres:16-alpine
    container_name: ecologistica-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecologistica
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecologistica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: